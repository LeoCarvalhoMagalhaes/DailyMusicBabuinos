# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Cria: API (Docker), site estático do frontend e PostgreSQL gratuito.
# Depois do primeiro deploy, confira as URLs geradas e ajuste CORS_ORIGINS e
# VITE_API_BASE_URL se os nomes dos serviços forem diferentes.
databases:
  - name: musicas-babuinas-db
    plan: free
    databaseName: babuinos
    user: babuinos

services:
  - type: web
    name: musicas-babuinas-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: musicas-babuinas-db
          property: connectionString
      - key: CHALLENGE_SECRET
        generateValue: true
      - key: AUDIO_PROVIDER
        value: deezer
      - key: CHALLENGE_TIMEZONE
        value: America/Sao_Paulo
      - key: CORS_ORIGINS
        value: https://musicas-babuinas.onrender.com

  - type: web
    name: musicas-babuinas
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://musicas-babuinas-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
